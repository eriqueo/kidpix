name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build application
        run: yarn build

      - name: Create release archive
        run: tar -czf kidpix-${{ github.ref_name }}.tar.gz -C dist .

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: kidpix-${{ github.ref_name }}.tar.gz
          name: "Kid Pix ${{ github.ref_name }}"
          body: |
            A maintained fork of vikrum's HTML/JS reimplementation of the 1989 Kid Pix drawing app.

            ## How to Run
            1. Download the `kidpix-${{ github.ref_name }}.tar.gz` file below
            2. Extract the archive to a folder
            3. Run a local web server in the extracted folder (e.g., `python -m http.server` or `npx serve .`)
            4. Open the served URL in your browser ( http://localhost:8000/ )
            5. Start drawing!

            Enjoy creating digital masterpieces! 🎨
          draft: false
          prerelease: false
